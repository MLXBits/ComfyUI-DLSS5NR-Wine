Section "ServerFlags"
    Option "AutoAddDevices"    "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch"      "true"
EndSection

Section "Device"
    Identifier "dummy"
    Driver     "dummy"
    VideoRam   256000
EndSection

Section "Monitor"
    Identifier  "dummy_monitor"
    HorizSync   28.0-90.0
    VertRefresh 48.0-75.0
    DisplaySize 531 299
    # 这条 Modeline 是整件事的关键：它让 RandR 报出真实的 60.00 Hz。
    # Xvfb 报 0.00 Hz，DXVK 在 swapchain 创建时拿它做整数除法 ->
    # idivq %r12 (r12=0) -> EXCEPTION_INT_DIVIDE_BY_ZERO 0xc0000094，worker 退出码 148。
    # 佐证：dxvk#3382 最后一条评论、dxvk#3706。详见 docs/FINDINGS.md。
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option "PreferredMode" "1920x1080"
EndSection

Section "Screen"
    Identifier   "dummy_screen"
    Device       "dummy"
    Monitor      "dummy_monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080"
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "dummy_layout"
    Screen     "dummy_screen"
EndSection
